#VRML_SIM R2025a utf8

PROTO ClinicBlock [
  field SFVec3f translation 0 0 0.5
  field SFVec3f size 1 1 1
  field SFColor color 0.8 0.85 0.85
  field SFString name "clinic fixture"
] {
  Solid {
    translation IS translation
    name IS name
    children [
      Shape {
        appearance PBRAppearance { baseColor IS color roughness 0.65 metalness 0 }
        geometry DEF GEOMETRY Box { size IS size }
      }
    ]
    boundingObject USE GEOMETRY
  }
}